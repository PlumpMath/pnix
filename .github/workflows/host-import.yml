name: host-import

# Lightweight dual-axis / library import checks. Runs on push to main and PRs
# so host-env regressions surface without waiting for a PR-only full host matrix.
# Full per-host gates remain in hosts.yml (PR / workflow_dispatch).

on:
  push:
    branches: [main]
    paths:
      - "bin/host-import-smoke"
      - "bin/host-library-smokes"
      - "examples/host-import/**"
      - "HOST_*.md"
      - "pnix-clj/**/export-pnix-clj-library"
      - "pnix-clj/**/pnix-clj-library-smoke"
      - "pnix-hy/**/export-pnix-hy-library"
      - "pnix-hy/**/pnix-hy-library-smoke"
      - "pnix-rs/**/export-pnix-rs-library"
      - "pnix-rs/**/pnix-rs-library-smoke"
      - "pnix-cljs/bin/export-pnix-cljs-library"
      - "pnix-cljs/bin/pnix-cljs-library-smoke"
      - "pnix-clr/bin/export-pnix-clr-library"
      - "pnix-clr/bin/pnix-clr-nupkg-smoke"
      - "pnix-clj/flake.nix"
      - "pnix-hy/**"
      - "pnix-rs/**"
      - "pnix-cljs/flake.nix"
      - "pnix-clr/flake.nix"
      - ".github/workflows/host-import.yml"
  pull_request:
    paths:
      - "bin/host-import-smoke"
      - "bin/host-library-smokes"
      - "examples/host-import/**"
      - "HOST_*.md"
      - "pnix-clj/**/export-pnix-clj-library"
      - "pnix-clj/**/pnix-clj-library-smoke"
      - "pnix-hy/**/export-pnix-hy-library"
      - "pnix-hy/**/pnix-hy-library-smoke"
      - "pnix-rs/**/export-pnix-rs-library"
      - "pnix-rs/**/pnix-rs-library-smoke"
      - "pnix-cljs/bin/export-pnix-cljs-library"
      - "pnix-cljs/bin/pnix-cljs-library-smoke"
      - "pnix-clr/bin/export-pnix-clr-library"
      - "pnix-clr/bin/pnix-clr-nupkg-smoke"
      - "pnix-clj/flake.nix"
      - "pnix-hy/**"
      - "pnix-rs/**"
      - "pnix-cljs/flake.nix"
      - "pnix-clr/flake.nix"
      - ".github/workflows/host-import.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: host-import-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NIX_CONFIG: "experimental-features = nix-command flakes"

jobs:
  layout-and-examples:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: cachix/install-nix-action@v31.10.7
      - name: Check smoke script + examples layout
        run: |
          test -x bin/host-import-smoke
          bash -n bin/host-import-smoke
          test -x bin/host-library-smokes
          bash -n bin/host-library-smokes
          test -f HOST_ENV_P2_P3.md
          test -f HOST_IMPORT.md
          test -f examples/host-import/hello.px
          test -f examples/host-import/clj/deps.edn
          test -f examples/host-import/clj/smoke.clj
          test -f examples/host-import/hy/smoke.py
          test -f examples/host-import/cljs/smoke.mjs
          test -f examples/host-import/rs/pnix-rs-smoke/Cargo.toml
          test -x examples/host-import/clr/smoke
          bash -n examples/host-import/clr/smoke
      - name: Check local library export scripts (layout only)
        run: |
          set -euo pipefail
          for s in \
            pnix-clj/pnix-clj/bin/export-pnix-clj-library \
            pnix-clj/pnix-clj/bin/pnix-clj-library-smoke \
            pnix-hy/pnix-hy/bin/export-pnix-hy-library \
            pnix-hy/pnix-hy/bin/pnix-hy-library-smoke \
            pnix-rs/pnix-rs/bin/export-pnix-rs-library \
            pnix-rs/pnix-rs/bin/pnix-rs-library-smoke \
            pnix-cljs/bin/export-pnix-cljs-library \
            pnix-cljs/bin/pnix-cljs-library-smoke \
            pnix-clr/bin/export-pnix-clr-library \
            pnix-clr/bin/pack-pnix-clr-nupkg \
            pnix-clr/bin/pnix-clr-nupkg-smoke \
            pnix-clr/bin/pnix-clr-library-smoke
          do
            test -x "$s"
            bash -n "$s"
          done
          echo "local export scripts: OK"
      - name: clj host-import example
        run: |
          nix shell nixpkgs#clojure -c bash -lc '
            set -euo pipefail
            cd examples/host-import/clj
            out=$(clojure -M -m smoke)
            echo "clj example => $out"
            test "$out" = "3"
          '
      - name: clj multi-module import example
        run: |
          nix shell nixpkgs#clojure -c bash -lc '
            set -euo pipefail
            cd examples/host-import/clj-imports
            out=$(clojure -M -m smoke)
            echo "clj-imports example => $out"
            test "$out" = "3"
          '
      - name: rs path-dep crate
        run: |
          nix shell nixpkgs#cargo nixpkgs#rustc nixpkgs#stdenv.cc -c bash -lc '
            set -euo pipefail
            cd examples/host-import/rs/pnix-rs-smoke
            out=$(cargo run -q -- ../../hello.px)
            echo "rs example => $out"
            test "$out" = "3"
          '
      - name: hy host-import example (flake package)
        run: |
          set -euo pipefail
          cd pnix-hy
          # Prefer the library printer (stable PNIX_HY_LIBRARY=…/site-packages)
          # over find-on-result-link, which is brittle under pipefail/head and
          # macOS find path matching.
          site="$(
            nix run --no-write-lock-file .#pnix-hy-library \
              | sed -n 's/^PNIX_HY_LIBRARY=//p' | head -n1
          )"
          test -n "$site"
          test -d "$site/pnix_hy"
          export PYTHONPATH="$site${PYTHONPATH:+:$PYTHONPATH}"
          # nix shell preserves PYTHONPATH from the parent env by default.
          out=$(nix shell nixpkgs#python311 -c python ../examples/host-import/hy/smoke.py)
          echo "hy example => $out"
          test "$out" = "3"
      - name: clj local library export smoke
        run: |
          nix shell nixpkgs#clojure nixpkgs#rsync -c bash -lc '
            set -euo pipefail
            cd pnix-clj/pnix-clj
            ./bin/pnix-clj-library-smoke
          '
      - name: hy local library export smoke
        run: |
          nix shell nixpkgs#python311 nixpkgs#rsync -c bash -lc '
            set -euo pipefail
            cd pnix-hy/pnix-hy
            ./bin/pnix-hy-library-smoke
          '
      - name: cljs local library export smoke (if dist present)
        run: |
          set -euo pipefail
          if [[ -f pnix-cljs/pnix-cljs/dist/pnix-cljs-module.js ]]; then
            nix shell nixpkgs#nodejs -c bash -lc '
              set -euo pipefail
              cd pnix-cljs
              ./bin/pnix-cljs-library-smoke
            '
          else
            echo "SKIP cljs library smoke (no dist/; offline build or nix build)"
          fi

  library-print:
    name: library-print-${{ matrix.host }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: clj
            dir: pnix-clj
            app: pnix-clj-library
            expect: PNIX_CLJ_ROOT=
            timeout: 25
          - host: hy
            dir: pnix-hy
            app: pnix-hy-library
            expect: PNIX_HY_LIBRARY=
            timeout: 60
          - host: rs
            dir: pnix-rs
            app: pnix-rs-refs
            expect: PNIX_RS_LIB_DIR=
            timeout: 60
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: cachix/install-nix-action@v31.10.7
      - name: Print library env (${{ matrix.host }})
        run: |
          set -euo pipefail
          cd "${{ matrix.dir }}"
          out=$(nix run --no-write-lock-file ".#${{ matrix.app }}")
          echo "$out"
          echo "$out" | grep -F "${{ matrix.expect }}"
