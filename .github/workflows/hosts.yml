name: hosts

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hosts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NIX_CONFIG: "experimental-features = nix-command flakes"

# Each host is independent: its job builds and gates only its own tree.
# There is no cross-host job and no shared corpus — a failure in one host
# never blocks another.

jobs:
  clj-test-shards:
    name: clj-test-shard-${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      JAVA_TOOL_OPTIONS: >-
        -Xms128m -Xmx768m -XX:MaxMetaspaceSize=384m
        -XX:+ExitOnOutOfMemoryError
      MALLOC_ARENA_MAX: "2"
      PNIX_CLJ_GATE_HEARTBEAT: "1"
      PNIX_CLJ_GATE_HEARTBEAT_SECONDS: "60"
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: cachix/install-nix-action@v31.10.7
      - name: Run pnix-clj test shard
        run: |
          nix shell nixpkgs#clojure -c bash -lc '
            cd pnix-clj/pnix-clj
            bin/pnix-clj-gate foundation-test-shard "${{ matrix.shard }}/4"
          '

  clj-aggregate:
    needs: clj-test-shards
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      JAVA_TOOL_OPTIONS: >-
        -Xms128m -Xmx768m -XX:MaxMetaspaceSize=384m
        -XX:+ExitOnOutOfMemoryError
      MALLOC_ARENA_MAX: "2"
      PNIX_CLJ_GATE_HEARTBEAT: "1"
      PNIX_CLJ_GATE_HEARTBEAT_SECONDS: "60"
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: cachix/install-nix-action@v31.10.7
      - name: Run pnix-clj foundation aggregate
        run: nix shell nixpkgs#clojure -c bash -lc 'cd pnix-clj/pnix-clj && bin/pnix-clj-gate foundation-post-tests'

  cljs-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: cachix/install-nix-action@v31.10.7
      - name: Run pnix-cljs gate
        run: cd pnix-cljs && nix flake check --no-build

  clr-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: cachix/install-nix-action@v31.10.7
      - name: Run pnix-clr gate
        run: cd pnix-clr && nix run .#gate

  hy-aggregate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: cachix/install-nix-action@v31.10.7
      - name: Run pnix-hy aggregate
        run: |
          cd pnix-hy
          # PNIX_HY_PYTHON expands in the inner bash launched by nix develop.
          # shellcheck disable=SC2016
          nix develop . --command bash -c \
            'cd pnix-hy && "$PNIX_HY_PYTHON" -m pnix_hy.cli --gate'

  rs-aggregate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: cachix/install-nix-action@v31.10.7
      - name: Run pnix-rs aggregate
        run: cd pnix-rs/pnix-rs && nix run ..#pnix-rs-check

  # P2.3 Phase A: host-import layout + cheap clj example (not full 5-host PATH smoke).
  # Full ./bin/host-import-smoke stays local/HM until multi-toolchain CI is justified.
  host-import-layout:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: cachix/install-nix-action@v31.10.7
      - name: Check smoke script + examples layout
        run: |
          test -x bin/host-import-smoke
          bash -n bin/host-import-smoke
          test -f HOST_ENV_P2_P3.md
          test -f examples/host-import/hello.px
          test -f examples/host-import/clj/deps.edn
          test -f examples/host-import/clj/smoke.clj
          test -f examples/host-import/hy/smoke.py
          test -f examples/host-import/cljs/smoke.mjs
      - name: Run clj host-import mini example
        run: |
          nix shell nixpkgs#clojure -c bash -lc '
            set -euo pipefail
            cd examples/host-import/clj
            out=$(clojure -M -m smoke)
            echo "clj example => $out"
            test "$out" = "3"
          '
      - name: Run rs path-dep mini crate
        run: |
          nix shell nixpkgs#cargo nixpkgs#rustc nixpkgs#gcc -c bash -lc '
            set -euo pipefail
            cd examples/host-import/rs/pnix-rs-smoke
            out=$(cargo run -q -- ../../hello.px)
            echo "rs example => $out"
            test "$out" = "3"
          '

  # P2.3 Phase B: each host flake can print its library env contract.
  # Independent of HM PATH; fail-fast false so one host cannot hide others.
  # cljs builds the full JS package (heavier); clr export may need network.
  host-import-library:
    name: host-import-library-${{ matrix.host }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: clj
            dir: pnix-clj
            app: pnix-clj-library
            expect: PNIX_CLJ_ROOT=
            timeout: 20
          - host: hy
            dir: pnix-hy
            app: pnix-hy-library
            expect: PNIX_HY_LIBRARY=
            timeout: 45
          - host: rs
            dir: pnix-rs
            app: pnix-rs-refs
            expect: PNIX_RS_LIB_DIR=
            timeout: 45
          - host: cljs
            dir: pnix-cljs
            app: pnix-cljs-library
            expect: PNIX_CLJS_SHARE=
            timeout: 90
          - host: clr
            dir: pnix-clr
            app: pnix-clr-refs
            expect: PNIX_CLR
            timeout: 90
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: cachix/install-nix-action@v31.10.7
      - name: Print library env (${{ matrix.host }})
        run: |
          set -euo pipefail
          cd "${{ matrix.dir }}"
          out=$(nix run ".#${{ matrix.app }}" --no-write-lock-file)
          echo "$out"
          echo "$out" | grep -F "${{ matrix.expect }}"
