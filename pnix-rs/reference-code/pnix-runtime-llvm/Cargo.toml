[package]
name = "pnix-runtime-llvm"
version.workspace = true
edition = "2021"
description = "LLVM JIT/AOT runtime (feature-gated)"
license.workspace = true
repository.workspace = true

[dependencies]
pnix-runtime-api = { path = "../pnix-runtime-api" }
pnix-core = { path = "../pnix-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pnix-hash = { path = "../pnix-hash" }

# LLVM dependencies (feature-gated)
[features]
default = []
llvm = ["dep:inkwell", "dep:libloading", "dep:libc"]
[dependencies.inkwell]
version = "0.9"  # LLVM 18 support
optional = true
default-features = false
features = ["llvm18-1"]
[dependencies.libloading]
version = "0.9"
optional = true
[dependencies.libc]
version = "0.2"
optional = true
