# cargo-deny configuration for pnix-core
# 헌법 준수: 런타임/IO/시간 의존성 금지

[advisories]
ignore = []

[bans]
# 금지된 크레이트 (헌법 위반)
deny = [
    # 런타임/비동기
    { crate = "tokio" },
    { crate = "async-std" },
    { crate = "futures" },
    { crate = "async-trait" },
    
    # 네트워크/HTTP
    { crate = "reqwest" },
    { crate = "ureq" },
    { crate = "hyper" },
    
    # 시간/날짜 (런타임 의존)
    { crate = "chrono" },
    { crate = "time" },
    
    # LLVM 바인딩 (실행 의존)
    { crate = "llvm-sys" },
    { crate = "inkwell" },
    
    # 파일 시스템 I/O
    { crate = "walkdir" },
    
    # 멀티스레딩 런타임
    { crate = "rayon" },
]

# 허용되는 크레이트 (헌법 준수)
allow = []

[licenses]
# 라이선스 체크
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",
]
confidence-threshold = 0.8

[sources]
# 소스 허용
allow-git = []
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
unknown-registry = "deny"
unknown-git = "deny"
