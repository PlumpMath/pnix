[package]
name = "pnix-runtime-api"
version.workspace = true
edition = "2021"
description = "Runtime API traits and config types for pnix runtimes"
license.workspace = true
repository.workspace = true

[features]
default = []
# V01: Async runtime support (experimental)
async-runtime = []
# V02: Dynamic plugin loading (experimental)
dynamic-plugins = ["libloading"]
# V04: Debugging support (experimental)
debugger = []

[dependencies]
serde.workspace = true
libloading = { version = "0.9", optional = true }
