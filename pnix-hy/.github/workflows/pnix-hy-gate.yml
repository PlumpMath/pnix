name: pnix-hy gate

# Automatically enforces the project-management gate (proposal 0011/0012): the code-derived
# capability index stays current, docs<->code drift is caught, and the sacred lanes + toolkit
# self-checks do not regress. Runs the EXISTING gates only -- no new check logic.

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

jobs:
  gate:
    name: pnix-hy check + capabilities drift + gate
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: pnix-hy
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        id: setup
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Hy 1.3.0 (the projection / proof Python)
        run: |
          python -m pip install --upgrade pip
          python -m pip install "hy==1.3.0"

      - name: Syntax check
        run: python -m py_compile pnix-hy/pnix_hy/capabilities.py pnix-hy/pnix_hy/cli.py

      - name: Toolkit self-checks (check, includes docs_drift)
        env:
          PNIX_HY_PYTHON: ${{ steps.setup.outputs.python-path }}
        run: |
          python -m pnix_hy.cli --check || {
            echo "::group::--check --json (diagnostics)"
            python -m pnix_hy.cli --check --json
            echo "::endgroup::"
            exit 1
          }

      - name: Capability index is current (regenerate + no diff)
        run: |
          python -m pnix_hy.cli --capabilities > pnix-hy/docs/CAPABILITIES.md
          git diff --exit-code pnix-hy/docs/CAPABILITIES.md

      - name: Production ship-gate (sacred lanes + toolkit)
        env:
          PNIX_HY_PYTHON: ${{ steps.setup.outputs.python-path }}
        run: python -m pnix_hy.cli --gate
