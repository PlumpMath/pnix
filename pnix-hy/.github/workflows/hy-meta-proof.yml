name: hy-meta proof

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

jobs:
  smoke:
    name: Python ${{ matrix.python-version }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.14"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Hy test package
        run: |
          python -m pip install --upgrade pip
          python -m pip install "hy==1.3.0" pytest

      - name: Syntax and whitespace checks
        run: |
          python -m py_compile hy-meta/bootstrap.py hy-meta/smoke_test.py
          git diff --check

      - name: Run hy-meta smoke
        run: python hy-meta/smoke_test.py
